<!DOCTYPE html>
<html>
<head>
    <title>WebAuditX</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            width: 450px;
            margin: auto;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 12px 20px;
            background: #38bdf8;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        #loader {
            display: none;
            margin-top: 20px;
        }

        .spinner {
            border: 5px solid #1e293b;
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .progress-container {
            width: 100%;
            background: #334155;
            border-radius: 5px;
            margin-top: 15px;
        }

        #progress-bar {
            height: 18px;
            width: 0%;
            background: #38bdf8;
            border-radius: 5px;
            transition: width 0.4s ease;
        }

        #progress-percent {
            margin-top: 6px;
            font-size: 13px;
            color: #94a3b8;
        }

        #status-text {
            margin-top: 10px;
            color: #38bdf8;
            font-weight: bold;
        }

        /* 🔥 LOG PANEL */
        #logs-panel {
            margin-top: 20px;
            background: #020617;
            padding: 10px;
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border-radius: 8px;
            text-align: left;
            border: 1px solid #334155;
        }

        .log-safe { color: #22c55e; }
        .log-warn { color: #f59e0b; }
        .log-danger { color: #ef4444; }
        .log-info { color: #38bdf8; }
    </style>
</head>

<body>

<h1>🔐 WebAuditX Scanner</h1>

<div class="container">

    <input type="text" id="url" placeholder="https://example.com">
    <br>
    <button onclick="startScan()">Start Scan</button>

    <div id="loader">
        <div class="spinner"></div>

        <p id="status-text">Starting scan...</p>

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <p id="progress-percent">0%</p>

        <div id="logs-panel"></div>
    </div>

</div>

<script>

function colorLog(log) {
    if (log.includes("[!]")) return "log-danger";
    if (log.includes("[+]")) return "log-safe";
    if (log.includes("[✓]")) return "log-safe";
    return "log-info";
}

async function startScan() {
    const url = document.getElementById("url").value;

    if (!url) {
        alert("Enter URL");
        return;
    }

    document.getElementById("loader").style.display = "block";

    document.getElementById("logs-panel").innerHTML = "";

    const res = await fetch("/scan", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `url=${encodeURIComponent(url)}`
    });

    const data = await res.json();
    pollProgress(data.scan_id);
}

async function pollProgress(scanId) {

    let lastLogCount = 0;

    const interval = setInterval(async () => {

        const res = await fetch(`/scan_status/${scanId}`);
        const data = await res.json();

        document.getElementById("progress-bar").style.width = data.progress + "%";
        document.getElementById("progress-percent").innerText = data.progress + "%";

        document.getElementById("status-text").innerText =
            data.message || data.status;

        // 🔥 ADD ONLY NEW LOGS (NO FLICKER)
        const logsPanel = document.getElementById("logs-panel");

        if (data.logs && data.logs.length > lastLogCount) {

            const newLogs = data.logs.slice(lastLogCount);

            newLogs.forEach(log => {
                const div = document.createElement("div");
                div.className = colorLog(log);
                div.textContent = log;
                logsPanel.appendChild(div);
            });

            logsPanel.scrollTop = logsPanel.scrollHeight;

            lastLogCount = data.logs.length;
        }

        if (data.status === "completed") {
            clearInterval(interval);

            setTimeout(() => {
                window.location.href = `/report/${scanId}`;
            }, 800);
        }

    }, 700);
}

</script>

</body>
</html>
